[project]
name = "aha-sdk-client-demo"
version = "0.1.0"
description = "通过 aha SDK 连接 Audio Harness 的浏览器工作台"
authors = [{name = "migo", email = "1695587905@qq.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["fastapi[standard]>=0.139,<0.141", "httpx>=0.28,<0.29", "typer>=0.20,<0.21", "websockets>=15,<16", "python-dotenv>=1.2,<2"]

[tool.poetry]
packages = [{include = "aha_sdk_demo", from = "src"}]

[tool.poetry.scripts]
aha-sdk-demo = "aha_sdk_demo.commands.app:app"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<9"
pytest-asyncio = ">=1.2,<2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
