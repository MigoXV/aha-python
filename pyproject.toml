[project]
name = "aha-python"
version = "0.1.0"
description = "Audio Harness 同步与异步 Python SDK 及共享 Realtime 契约"
authors = [{name = "migo", email = "1695587905@qq.com"}]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai>=2.50.0,<2.51.0",
    "pydantic>=2.13.0,<3.0.0",
    "websockets>=15,<16",
    "typer>=0.20.0,<0.21.0",
]

[tool.poetry]
packages = [{include = "aha", from = "src"}]

[tool.poetry.scripts]
aha = "aha.commands.app:app"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
